function renderStandings() {
    var el = document.getElementById('standings-content');
    if (!app.tournaments.length) {
        el.innerHTML = emptyState('No tournaments yet. Check back after the first week!');
        return;
    }

    var stats = {};
    app.tournaments.forEach(function(t) {
        var cutStatsEligible = shouldUseTournamentForCutStats(t);
        t.participants.forEach(function(p) {
            if (!stats[p.name]) stats[p.name] = { name:p.name, winnings:0, entries:0, wins:0, top3:0, played:0, totalPoints:0, rosterMadeCutCount:0, rosterKnownCutCount:0 };
            var s = stats[p.name];
            s.winnings += p.prize; s.entries += t.entryFee; s.played++;
            s.totalPoints += p.score;
            if (p.position === 1) s.wins++;
            if (p.position <= 3)  s.top3++;
            if (!cutStatsEligible) return;
            (p.lineup || []).forEach(function(lp) {
                if (lp.madeCut === true) {
                    s.rosterMadeCutCount += 1;
                    s.rosterKnownCutCount += 1;
                } else if (lp.madeCut === false || lp.cutStatus === 'missed_cut') {
                    s.rosterKnownCutCount += 1;
                }
            });
        });
    });

    var columns = [
        { key: 'name', getValue: function(row) { return row.name; } },
        { key: 'played', getValue: function(row) { return row.played; } },
        { key: 'avgPoints', getValue: function(row) { return row.avgPoints; } },
        { key: 'wins', getValue: function(row) { return row.wins; } },
        { key: 'top3', getValue: function(row) { return row.top3; } },
        { key: 'winnings', getValue: function(row) { return row.winnings; } },
        { key: 'rosterMadeCutRate', getValue: function(row) { return row.rosterMadeCutRate; } },
        { key: 'net', getValue: function(row) { return row.net; } }
    ];

    var rows = Object.keys(stats).map(function(k){
        var s = stats[k];
        var avgPoints = s.played > 0 ? s.totalPoints / s.played : 0;
        var rosterMadeCutRate = s.rosterKnownCutCount ? (s.rosterMadeCutCount / s.rosterKnownCutCount) : 0;
        return { name:s.name, winnings:s.winnings, entries:s.entries, wins:s.wins, top3:s.top3, played:s.played, net:s.winnings-s.entries, avgPoints:avgPoints, rosterMadeCutRate:rosterMadeCutRate, rosterMadeCutCount:s.rosterMadeCutCount, rosterKnownCutCount:s.rosterKnownCutCount };
    });
    rows = sortByColumns(rows, columns, standingsSort, 'winnings');

    var totalPrizes = app.tournaments.reduce(function(s,t){ return s+(t.totalPrizes||0); },0);

    var mobile = isMobileViewport();
    var html =
        '<div class="stats-grid">' +
          '<div class="stat-card"><div class="stat-value">' + app.tournaments.length + '</div><div class="stat-label">Tournaments</div></div>' +
          '<div class="stat-card"><div class="stat-value">$' + totalPrizes.toFixed(2) + '</div><div class="stat-label">Total Prizes Paid</div></div>' +
        '<div class="stat-card"><div class="stat-value">' + Object.keys(stats).length + '</div><div class="stat-label">Players</div></div>' +
        '</div>';
    if (mobile) {
        html += '<div class="mobile-stack">';
        rows.forEach(function(p, i) {
            var r = i + 1;
            var rc = r===1?'rank-1':r===2?'rank-2':r===3?'rank-3':'rank-other';
            html += '<div class="mobile-card"><div class="mobile-card-head"><div><div class="mobile-card-title">' + buildPlayerLink(p.name) + '</div><div class="mobile-card-subtitle">' + p.played + ' events • ' + p.wins + ' wins • ' + p.top3 + ' top 3s</div></div><div class="mobile-rank"><span class="rank-badge ' + rc + '">' + r + '</span></div></div><div class="mobile-metric-grid">' +
                buildMobileMetric('Winnings', '$' + p.winnings.toFixed(2), 'money') +
                buildMobileMetric('Made Cut %', p.rosterKnownCutCount ? ((p.rosterMadeCutRate * 100).toFixed(0) + '%') : '—', p.rosterMadeCutRate >= 0.66 ? 'money' : '') +
                buildMobileMetric('Net Profit', (p.net>=0?'+':'') + '$' + p.net.toFixed(2), p.net >= 0 ? 'money' : 'money negative') +
                buildMobileMetric('Avg Pts', p.avgPoints.toFixed(1)) +
            '</div></div>';
        });
        html += '</div>';
    } else {
        html += '<div class="table-container"><table>' +
        '<thead><tr><th>Rank</th>' +
        buildSortHeader('Player', 'name', standingsSort, 'setStandingsSort', 'asc') +
        buildSortHeader('Played', 'played', standingsSort, 'setStandingsSort', 'desc') +
        buildSortHeader('Avg Pts', 'avgPoints', standingsSort, 'setStandingsSort', 'desc') +
        buildSortHeader('Wins', 'wins', standingsSort, 'setStandingsSort', 'desc') +
        buildSortHeader('Top 3', 'top3', standingsSort, 'setStandingsSort', 'desc') +
        buildSortHeader('Winnings', 'winnings', standingsSort, 'setStandingsSort', 'desc') +
        buildSortHeader('Made Cut %', 'rosterMadeCutRate', standingsSort, 'setStandingsSort', 'desc') +
        buildSortHeader('Net Profit', 'net', standingsSort, 'setStandingsSort', 'desc') +
        '</tr></thead>' +
        '<tbody>';

        rows.forEach(function(p,i){
            var r = i+1;
            var rc = r===1?'rank-1':r===2?'rank-2':r===3?'rank-3':'rank-other';
            var nc = p.net >= 0 ? 'money' : 'money negative';
            html += '<tr>' +
                '<td><span class="rank-badge ' + rc + '">' + r + '</span></td>' +
                '<td>' + buildPlayerLink(p.name) + '</td>' +
                '<td>' + p.played + '</td>' +
                '<td>' + p.avgPoints.toFixed(1) + '</td>' +
                '<td>' + p.wins + '</td><td>' + p.top3 + '</td>' +
                '<td class="money">$' + p.winnings.toFixed(2) + '</td>' +
                '<td>' + (p.rosterKnownCutCount ? ((p.rosterMadeCutRate * 100).toFixed(0) + '%') : '—') + '</td>' +
                '<td class="' + nc + '">' + (p.net>=0?'+':'') + '$' + p.net.toFixed(2) + '</td>' +
            '</tr>';
        });
        html += '</tbody></table></div>';
    }
    el.innerHTML = html;
}

// ── TOURNAMENT HISTORY ────────────────────────────────────────
function renderTournaments() {
    var el = document.getElementById('tournaments-content');
    if (!app.tournaments.length) { el.innerHTML = emptyState('No tournament history yet.'); return; }

    var sorted = app.tournaments.slice().sort(function(a,b){ return new Date(b.date)-new Date(a.date); });
    var html = '';
    var mobile = isMobileViewport();

    sorted.forEach(function(t) {
        var dateStr = formatTournamentDate(t.date, { month:'long', day:'numeric', year:'numeric' });
        var bc = t.type==='major'?'badge-major':'badge-regular';
        var bt = t.type==='major'?'MAJOR':'REGULAR';
        var insights = summarizeTournamentInsights(t);
        var isExpanded = !!tournamentExpandState[String(t.id)];
        var trows = '';
        t.participants.forEach(function(p){
            var rc = p.position===1?'rank-1':p.position===2?'rank-2':p.position===3?'rank-3':'rank-other';
            trows += '<tr>' +
                '<td><span class="rank-badge '+rc+'">'+p.position+'</span></td>' +
                '<td><strong>'+escHtml(p.name)+'</strong></td>' +
                '<td>'+p.score.toFixed(2)+'</td>' +
                '<td class="money">'+(p.prize>0?'$'+p.prize.toFixed(2):'—')+'</td>' +
                '<td>' + (p.lineup && p.lineup.length ? '<button class="lineup-link" type="button" onclick="openLineupModal(' + t.id + ', \'' + encodeForInlineHandler(String(p.name)) + '\')">View Team</button>' : '—') + '</td>' +
            '</tr>';
        });

        html +=
            '<div class="tournament-item">' +
              '<div class="tournament-header"><div>' +
                '<div class="tournament-name">'+escHtml(t.name)+'</div>' +
                '<div class="tournament-meta">' + dateStr + ' • ' + escHtml(t.location) + '</div>' +
              '</div><div class="tournament-header-actions"><span class="badge '+bc+'">'+bt+'</span><button class="tournament-toggle" type="button" onclick="toggleTournamentDetails('+t.id+')">' + (isExpanded ? 'Hide Details' : 'Expand') + '</button></div></div>' +
              '<div class="tournament-body' + (isExpanded ? '' : ' hidden') + '">' +
              '<div class="tournament-details">' +
                '<div class="detail-item"><strong>Location</strong>'+escHtml(t.location)+'</div>' +
                '<div class="detail-item"><strong>Final Round</strong>'+dateStr+'</div>' +
                '<div class="detail-item"><strong>Entry Fee</strong>$'+t.entryFee+'</div>' +
                '<div class="detail-item"><strong>Gross Pool</strong>$'+t.grossPool.toFixed(2)+'</div>' +
                '<div class="detail-item"><strong>Prizes Paid</strong>$'+(t.totalPrizes||0).toFixed(2)+'</div>' +
              '</div>' +
              '<div class="insight-grid">' +
                '<div class="insight-card"><div class="insight-label">Most Rostered Golfer</div><div class="insight-value">' + (insights.mostRostered ? escHtml(insights.mostRostered.playerName) : 'Not available') + '</div><div class="insight-subvalue">' + (insights.mostRostered ? (insights.mostRostered.appearances + ' lineups') : 'Needs imported lineup detail') + '</div></div>' +
                '<div class="insight-card"><div class="insight-label">Highest Field Score</div><div class="insight-value">' + (insights.highestField ? escHtml(insights.highestField.playerName) : 'Not available') + '</div><div class="insight-subvalue">' + (insights.highestField && insights.highestField.fantasyPoints != null ? fmtScore(insights.highestField.fantasyPoints) + ' DK pts' : 'Needs imported field stats') + '</div></div>' +
                '<div class="insight-card"><div class="insight-label">Winning Lineup Edge</div><div class="insight-value">' + (insights.winningEdge ? escHtml(insights.winningEdge.playerName) : 'Not available') + '</div><div class="insight-subvalue">' + (insights.winningEdge && insights.winningEdge.fantasyPoints != null ? fmtScore(insights.winningEdge.fantasyPoints) + ' DK pts' : 'Needs first-place lineup detail') + '</div></div>' +
                '<div class="insight-card"><div class="insight-label">Field Chalk</div><div class="insight-value">' + (insights.chalkiest ? escHtml(insights.chalkiest.playerName) : 'Not available') + '</div><div class="insight-subvalue">' + (insights.chalkiest && insights.chalkiest.draftedPct != null ? insights.chalkiest.draftedPct.toFixed(1) + '% rostered' : 'Ownership not imported') + '</div></div>' +
              '</div>' +
              (mobile
                ? '<div class="mobile-stack">' + t.participants.map(function(p) {
                    var rc = p.position===1?'rank-1':p.position===2?'rank-2':p.position===3?'rank-3':'rank-other';
                    return '<div class="mobile-card"><div class="mobile-card-head"><div><div class="mobile-card-title">' + escHtml(p.name) + '</div><div class="mobile-card-subtitle">Finish ' + p.position + '</div></div><div class="mobile-rank"><span class="rank-badge ' + rc + '">' + p.position + '</span></div></div><div class="mobile-metric-grid">' +
                      buildMobileMetric('DK Score', p.score.toFixed(2)) +
                      buildMobileMetric('Prize', p.prize>0?'$'+p.prize.toFixed(2):'—', p.prize > 0 ? 'money' : '') +
                    '</div><div class="mobile-actions">' + (p.lineup && p.lineup.length ? '<button class="lineup-link" type="button" onclick="openLineupModal(' + t.id + ', \'' + encodeForInlineHandler(String(p.name)) + '\')">View Team</button>' : '') + '</div></div>';
                  }).join('') + '</div>'
                : '<div class="table-container"><table><thead><tr><th>Pos</th><th>Player</th><th>DK Score</th><th>Prize Won</th><th>Lineup</th></tr></thead><tbody>'+trows+'</tbody></table></div>') +
              '</div>' +
            '</div>';
    });
    el.innerHTML = html;
}

window.toggleTournamentDetails = function(id) {
    var key = String(id);
    tournamentExpandState[key] = !tournamentExpandState[key];
    renderTournaments();
};

window.openLineupModal = function(tournamentId, participantName) {
    var modal = document.getElementById('lineup-modal');
    var body = document.getElementById('lineup-modal-body');
    var title = document.getElementById('lineup-modal-title');
    var subtitle = document.getElementById('lineup-modal-subtitle');
    var tournament = null;
    var entry = null;

    app.tournaments.forEach(function(t) {
        if (String(t.id) === String(tournamentId)) {
            tournament = t;
        }
    });

    if (tournament) {
        entry = getTournamentEntry(tournament, decodeURIComponent(participantName));
    }

    if (!tournament || !entry || !entry.lineup || !entry.lineup.length) return;

    title.textContent = entry.name + ' Lineup';
    subtitle.textContent = tournament.name + ' • ' + formatTournamentDate(tournament.date, { month: 'long', day: 'numeric', year: 'numeric' });
    body.innerHTML = buildLineupModalTable(entry, tournament);
    modal.classList.remove('hidden');
    modal.classList.add('visible');
    modal.setAttribute('aria-hidden', 'false');
};

window.closeLineupModal = function() {
    var modal = document.getElementById('lineup-modal');
    modal.classList.remove('visible');
    modal.classList.add('hidden');
    modal.setAttribute('aria-hidden', 'true');
};

document.getElementById('lineup-modal-close').addEventListener('click', window.closeLineupModal);
document.getElementById('lineup-modal').addEventListener('click', function(e) {
    if (e.target === this) window.closeLineupModal();
});
document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') window.closeLineupModal();
});

// ── HELPERS ───────────────────────────────────────────────────
function escHtml(str) {
    return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// encodeURIComponent leaves ' unescaped, which breaks (or can be abused to
// break out of) the single-quoted JS string literal in inline onclick="...('...')"
// handlers below. Percent-encode it too; decodeURIComponent still round-trips it.
function encodeForInlineHandler(str) {
    return encodeURIComponent(str).replace(/'/g, '%27');
}

function emptyState(msg) {
    return '<div class="empty-state"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24">' +
        '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>' +
        '</svg><p>'+msg+'</p></div>';
}

// ── INIT ──────────────────────────────────────────────────────
loadData(function() {
    applyRoute({ normalizeHash: true });
});

window.addEventListener('hashchange', function() {
    applyRoute();
});

var lastMobileViewport = isMobileViewport();
window.addEventListener('resize', function() {
    var nextMobile = isMobileViewport();
    if (nextMobile === lastMobileViewport) return;
    lastMobileViewport = nextMobile;
    applyRoute();
});
</script>
